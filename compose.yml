services:
  file-service:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - 8003:8000
    # translate .env ROOT_DIRECTORY to docker variable and mount as volume
    environment:
      # - ROOT_DIRECTORY=/ROOT_DIRECTORY # for relative dir
      - ROOT_DIRECTORY=${ROOT_DIRECTORY}
    volumes:
      # - ${ROOT_DIRECTORY}:/ROOT_DIRECTORY for relative dir
      - ${ROOT_DIRECTORY}:${ROOT_DIRECTORY}
    networks:
      - service-network

# To connect to the other services (in different compose files)
# docker network create service-network
networks:
  service-network:
    external: true
